<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ต้นไม้ในเกม — พุ่มเมฆ + ขอบพื้น organic</title>
<style>
  :root{--bg:#1c140f;--panel:#2a1e16;--ink:#f5e6c6;--muted:#c4a982;--gold:#f2c14e;--out:#2a1b14}
  body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px 16px 40px}
  h1{font-size:20px;margin:0 0 6px}
  p{color:var(--muted);font-size:14px;line-height:1.5;max-width:70ch}
  .card{background:var(--panel);border:3px solid var(--out);padding:12px;margin:12px 0}
  .card h2{margin:0 0 8px;font-size:15px;color:var(--gold)}
  .stage{background:#5fa844;border:2px solid var(--out);padding:12px;overflow:auto}
  canvas{image-rendering:pixelated;display:block}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  .ok{color:#8cdc66}
</style>
</head>
<body>
  <h1>อัปเดตในเกมแล้ว: พุ่มเมฆ + ขอบดิน organic</h1>
  <p>รีเฟรชเกมแรงๆ แล้วเดินดูลาน/ขอบทาง/ต้นไม้ · หน้านี้โชว์สไปรต์จริงจาก <code>PixelArt.tree</code></p>
  <div class="card">
    <h2>ต้นไม้ในเกมตอนนี้ (พุ่มเมฆซ้อน)</h2>
    <div class="stage"><canvas id="cv" width="720" height="160"></canvas></div>
    <p class="ok" style="margin:8px 0 0">ใส่แมพจริงแล้ว · ไม่ใช่แค่ตัวอย่าง</p>
  </div>
  <script src="/shared.js"></script>
  <script src="/pixelart.js"></script>
  <script>
    const cv = document.getElementById('cv'), g = cv.getContext('2d');
    g.imageSmoothingEnabled = false; g.fillStyle = '#5fa844'; g.fillRect(0, 0, cv.width, cv.height);
    const kinds = ['broad', 'broad', null, null, 'pine', 'teak', 'gold', 'rose'];
    kinds.forEach((k, i) => {
      const s = PixelArt.tree(3 + i * 5, 4, k);
      g.drawImage(s, 10 + i * 88, 20, s.width * 2, s.height * 2);
    });
  </script>
</body>
</html>
