<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตัวอย่างหน้าขายของ (ร่าง)</title>
<style>
  :root { --ink:#4a3322; --paper:#f3e0b6; --paper-l:#fff4d6; --paper-d:#d9bd86; --edge:#2a1b14; --accent:#e8a33d; --accent-d:#b9791f; --good:#1e8f4e; --bad:#c0392b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:#2d4a2b; color:var(--ink); font-family:"Noto Sans Thai","Leelawadee UI","Thonburi",Tahoma,sans-serif; display:flex; flex-direction:column; align-items:center; padding:12px; gap:10px; }
  .toolbar { display:flex; gap:8px; align-items:center; color:#fff3cf; font-size:13px; }
  .toolbar button { border:2px solid var(--edge); background:var(--paper-l); padding:4px 12px; font-weight:700; cursor:pointer; }
  .toolbar button.on { background:var(--accent); color:#fff; }
  .frame { width:440px; max-width:100%; transition:width .2s; }
  .frame.phone { width:375px; }
  .panel { background:var(--paper); border:3px solid var(--edge); box-shadow:inset 0 3px 0 var(--paper-l), inset 0 -4px 0 var(--paper-d), 4px 4px 0 rgba(42,27,20,.4); padding:14px; position:relative; }
  h2 { margin:0 0 6px; font-size:20px; display:flex; justify-content:space-between; align-items:center; }
  .close { background:var(--accent); border:2px solid var(--edge); border-bottom-width:4px; padding:2px 12px; font-weight:700; color:#fff; font-size:14px; }
  .info { font-size:12px; opacity:.8; margin-bottom:8px; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tab { border:2px solid var(--edge); background:var(--paper-l); padding:4px 10px; font-weight:700; font-size:13px; }
  .tab.on { background:var(--accent); color:#fff; }
  /* รายการขาย: แถวเดียวกันทุกชนิด ไอคอน • ชื่อ • จำนวน • ราคา */
  .list { border:2px solid var(--edge); background:var(--paper-l); max-height:300px; overflow-y:auto; }
  .row { display:grid; grid-template-columns:34px minmax(0,1fr) auto auto; align-items:center; column-gap:8px; padding:6px 10px; min-height:42px; border-bottom:1px dashed var(--paper-d); cursor:pointer; }
  .row:last-child { border-bottom:0; }
  .row:hover { background:#ffeaba; }
  .row.sel { background:#ffd98a; box-shadow:inset 3px 0 0 var(--accent-d); }
  .ico { font-size:24px; text-align:center; line-height:1; }
  .nm { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cnt { font-size:12px; opacity:.75; }
  .pr { font-size:14px; font-weight:800; min-width:64px; text-align:right; white-space:nowrap; }
  .empty { padding:18px; text-align:center; opacity:.7; font-size:13px; }
  /* แถบที่เลือกอยู่ (ล่าง) */
  .bar { margin-top:10px; border:2px solid var(--edge); background:#fffdf5; padding:8px 10px; min-height:96px; }
  .bar.none { display:flex; align-items:center; justify-content:center; font-size:13px; opacity:.65; }
  .bar-hd { display:flex; align-items:center; gap:10px; }
  .bar-hd .ico { font-size:32px; }
  .bar-hd .t { font-weight:800; font-size:15px; line-height:1.2; }
  .bar-hd .s { font-size:11px; opacity:.8; }
  .trend.up { color:var(--good); } .trend.down { color:var(--bad); }
  .step { display:flex; align-items:center; gap:6px; margin:8px 0 6px; }
  .step button { width:34px; height:34px; border:2px solid var(--edge); background:var(--paper-l); font-weight:800; font-size:18px; line-height:1; }
  .step input { width:56px; height:34px; border:2px solid var(--edge); text-align:center; font:inherit; font-weight:700; background:#fff; }
  .step .tot { margin-left:auto; font-weight:800; font-size:15px; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .btn { background:var(--accent); border:2px solid var(--edge); border-bottom-width:4px; color:#fff; font-weight:700; min-height:36px; font-size:13px; padding:2px 8px; cursor:pointer; }
  .btn.alt { background:#8a6fd1; }
  .btn.muted { background:#9aa0a6; }
  .btn:active { transform:translateY(2px); border-bottom-width:2px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .confirm { display:none; border:2px solid var(--accent-d); background:#fff0c9; padding:8px 10px; margin-top:8px; font-size:13px; }
  .confirm.show { display:block; }
  .confirm .acts { margin-top:6px; }
  .toast { position:fixed; left:50%; top:10px; transform:translateX(-50%); background:rgba(35,22,14,.88); color:#fff3cf; padding:6px 14px; border-radius:12px; font-size:13px; font-weight:700; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show { opacity:1; }
  .note { font-size:11.5px; color:#fff3cf; max-width:440px; line-height:1.5; opacity:.9; }
  @media (max-width:520px) { .frame { width:100%; } }
</style>
</head>
<body>
<div class="toolbar">
  <span>ดูเป็น:</span><button id="vPc" class="on">💻 PC</button><button id="vPhone">📱 มือถือ</button>
  <span style="opacity:.7">• ใช้ลูกศรขึ้นลง + Enter ได้บน PC</span>
</div>

<div class="frame" id="frame">
  <div class="panel">
    <h2>🎣 ร้านตกปลา <button class="close">ปิด</button></h2>
    <div class="info">🎣 ชาวประมง เลเวล 1 • 🪙 <b id="coin">65</b></div>
    <div class="tabs"><span class="tab">🛒 ซื้อ</span><span class="tab">🧰 อุปกรณ์</span><span class="tab on">💰 ขาย</span></div>
    <div class="list" id="list" role="listbox" tabindex="0" aria-label="รายการที่ขายได้"></div>
    <div class="bar none" id="bar">แตะของที่ต้องการขายในรายการ</div>
    <div class="confirm" id="confirm"></div>
  </div>
</div>
<div class="note">ร่างหน้าขายแบบรายการ: แตะแถว = เลือก → ตั้งจำนวน → กด "ขาย 1" หรือ "ขายทั้งหมด" → ยืนยันอีกครั้งก่อนเงินเข้า • ไอคอนใช้พิกเซลอาร์ตเดิมของเกมตอนทำจริง</div>
<div class="toast" id="toast"></div>

<script>
// ข้อมูลตัวอย่าง (ของจริงมาจาก inv + ราคาตลาดของเซิร์ฟเวอร์)
const items = [
  { k:'bass', ico:'🐠', name:'ปลากะพง', n:4, unit:23, base:22 },
  { k:'shrimp', ico:'🦐', name:'กุ้ง', n:5, unit:31, base:33 },
  { k:'crab', ico:'🦀', name:'ปู', n:1, unit:41, base:41 },
  { k:'mack', ico:'🐟', name:'ปลาทู', n:1, unit:34, base:34 },
  { k:'jelly', ico:'🪼', name:'แมงกะพรุน', n:2, unit:229, base:210 },
  { k:'boot', ico:'🥾', name:'รองเท้าเก่า', n:1, unit:1, base:1 },
];
let coin = 65, sel = null, qty = 1;
const $ = id => document.getElementById(id);
// ราคาขายหลายชิ้น: ราคาต่อชิ้นลดลงทีละ 3% ถึงพื้น 80% (ตัวอย่างเท่านั้น)
const total = (it, n) => { let s = 0; for (let i = 0; i < n; i++) s += Math.round(it.unit * Math.max(.8, 1 - .03 * i)); return s; };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2200); }
function renderList() {
  const rows = items.filter(i => i.n > 0);
  $('list').innerHTML = rows.length ? rows.map(i => `<div class="row${sel === i.k ? ' sel' : ''}" role="option" data-k="${i.k}"><span class="ico">${i.ico}</span><span class="nm">${i.name}</span><span class="cnt">×${i.n}</span><span class="pr">🪙 ${i.unit}</span></div>`).join('') : '<div class="empty">ไม่มีของที่ร้านนี้รับซื้อแล้ว 🎒</div>';
}
function renderBar() {
  const it = items.find(i => i.k === sel), bar = $('bar');
  $('confirm').classList.remove('show');
  if (!it || it.n < 1) { sel = null; bar.className = 'bar none'; bar.textContent = 'แตะของที่ต้องการขายในรายการ'; return; }
  qty = Math.max(1, Math.min(it.n, qty));
  const d = Math.round((it.unit / it.base - 1) * 100), tr = d > 3 ? `<span class="trend up">▲ ${d}%</span>` : d < -3 ? `<span class="trend down">▼ ${-d}%</span>` : '';
  bar.className = 'bar';
  bar.innerHTML = `<div class="bar-hd"><span class="ico">${it.ico}</span><div><div class="t">${it.name} <small>(มี ${it.n})</small></div><div class="s">ราคาตลาด 🪙${it.unit} (ปกติ ${it.base}) ${tr}</div></div></div>
    <div class="step"><button id="m">−</button><input id="q" type="number" min="1" max="${it.n}" value="${qty}" inputmode="numeric"><button id="p">+</button><span class="tot">รับ 🪙 <span id="tt">${total(it, qty)}</span></span></div>
    <div class="acts"><button class="btn" id="sell1">ขาย ${qty} ชิ้น</button><button class="btn alt" id="sellAll" ${it.n < 2 ? 'disabled' : ''}>ขายทั้งหมด (${it.n})</button></div>`;
  const upd = () => { qty = Math.max(1, Math.min(it.n, Math.floor(+$('q').value) || 1)); $('q').value = qty; $('tt').textContent = total(it, qty); $('sell1').textContent = `ขาย ${qty} ชิ้น`; $('confirm').classList.remove('show'); };
  $('m').onclick = () => { $('q').value = qty - 1; upd(); };
  $('p').onclick = () => { $('q').value = qty + 1; upd(); };
  $('q').oninput = upd;
  $('sell1').onclick = () => ask(it, qty);
  $('sellAll').onclick = () => ask(it, it.n);
}
function ask(it, n) {
  const t = total(it, n), c = $('confirm');
  c.innerHTML = `ขาย <b>${it.ico} ${it.name} ×${n}</b> รับ <b>🪙 ${t}</b> ยืนยัน?<div class="acts"><button class="btn" id="yes">✅ ขาย</button><button class="btn muted" id="no">ยกเลิก</button></div>`;
  c.classList.add('show');
  $('yes').onclick = () => { it.n -= n; coin += t; $('coin').textContent = coin; toast(`ขาย ${it.name} ×${n} ได้ 🪙${t}`); if (it.n < 1) sel = null; renderList(); renderBar(); };
  $('no').onclick = () => c.classList.remove('show');
  $('yes').focus();
}
$('list').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; sel = r.dataset.k; qty = 1; renderList(); renderBar(); });
$('list').addEventListener('keydown', e => {
  const ks = items.filter(i => i.n > 0).map(i => i.k); if (!ks.length) return;
  let i = ks.indexOf(sel);
  if (e.key === 'ArrowDown') i = Math.min(ks.length - 1, i + 1); else if (e.key === 'ArrowUp') i = Math.max(0, i - 1); else if (e.key === 'Enter' && sel) { const it = items.find(x => x.k === sel); ask(it, qty); return; } else return;
  e.preventDefault(); sel = ks[i < 0 ? 0 : i]; qty = 1; renderList(); renderBar();
});
$('vPc').onclick = () => { $('frame').classList.remove('phone'); $('vPc').classList.add('on'); $('vPhone').classList.remove('on'); };
$('vPhone').onclick = () => { $('frame').classList.add('phone'); $('vPhone').classList.add('on'); $('vPc').classList.remove('on'); };
renderList(); renderBar();
</script>
</body>
</html>
